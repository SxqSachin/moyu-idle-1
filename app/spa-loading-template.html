<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        Object.defineProperty(globalThis, "_WebSocket", {
            value: globalThis.WebSocket,
            writable: false,
            configurable: false,
            enumerable: false
        });
        Object.freeze(globalThis._WebSocket);
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱🐟猫猫放置</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        .content {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 24px;
            box-sizing: border-box;
        }

        .loading-text {
            font-size: 24px;
            color: white;
            white-space: nowrap;
            margin-bottom: 0;
        }

        .version {
            position: fixed;
            bottom: 24px;
            font-size: 12px;
            color: rgba(255,255,255,0.9);
        }

        /* Progress UI */
        .progress-wrap {
            width: 360px;
            max-width: 90vw;
            margin-top: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.12);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            transition: width 220ms ease;
        }

        .progress-info {
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.95);
            display: flex;
            justify-content: space-between;
        }

        /* file list removed — only aggregated progress shown */

        /* Spinner */
        .sk-circle { margin: 8px auto; width: 40px; height: 40px; position: relative; }
        .sk-circle .sk-child { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
        .sk-circle .sk-child:before { content: ''; display: block; margin: 0 auto; width: 15%; height: 15%; background-color: rgba(255,255,255,0.9); border-radius: 100%; animation: sk-circleBounceDelay 1.2s infinite ease-in-out both; }
        .sk-circle .sk-circle2 { transform: rotate(30deg); }
        .sk-circle .sk-circle3 { transform: rotate(60deg); }
        .sk-circle .sk-circle4 { transform: rotate(90deg); }
        .sk-circle .sk-circle5 { transform: rotate(120deg); }
        .sk-circle .sk-circle6 { transform: rotate(150deg); }
        .sk-circle .sk-circle7 { transform: rotate(180deg); }
        .sk-circle .sk-circle8 { transform: rotate(210deg); }
        .sk-circle .sk-circle9 { transform: rotate(240deg); }
        .sk-circle .sk-circle10 { transform: rotate(270deg); }
        .sk-circle .sk-circle11 { transform: rotate(300deg); }
        .sk-circle .sk-circle12 { transform: rotate(330deg); }
        .sk-circle .sk-circle2:before { animation-delay: -1.1s; }
        .sk-circle .sk-circle3:before { animation-delay: -1s; }
        .sk-circle .sk-circle4:before { animation-delay: -0.9s; }
        .sk-circle .sk-circle5:before { animation-delay: -0.8s; }
        .sk-circle .sk-circle6:before { animation-delay: -0.7s; }
        .sk-circle .sk-circle7:before { animation-delay: -0.6s; }
        .sk-circle .sk-circle8:before { animation-delay: -0.5s; }
        .sk-circle .sk-circle9:before { animation-delay: -0.4s; }
        .sk-circle .sk-circle10:before { animation-delay: -0.3s; }
        .sk-circle .sk-circle11:before { animation-delay: -0.2s; }
        @keyframes sk-circleBounceDelay { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>

<body>
    <div class="content">
        <span class="loading-text">加载中，请稍候…</span>

        <div class="sk-circle" aria-hidden>
            <div class="sk-circle1 sk-child"></div>
            <div class="sk-circle2 sk-child"></div>
            <div class="sk-circle3 sk-child"></div>
            <div class="sk-circle4 sk-child"></div>
            <div class="sk-circle5 sk-child"></div>
            <div class="sk-circle6 sk-child"></div>
            <div class="sk-circle7 sk-child"></div>
            <div class="sk-circle8 sk-child"></div>
            <div class="sk-circle9 sk-child"></div>
            <div class="sk-circle10 sk-child"></div>
            <div class="sk-circle11 sk-child"></div>
            <div class="sk-circle12 sk-child"></div>
        </div>

        <div class="progress-wrap" role="status" aria-live="polite">
            <div class="progress-bar" aria-hidden>
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-info">
                <div id="progressText">正在加载应用资源…</div>
                <div id="progressPercent">0%</div>
            </div>
        </div>

        <span class="version">当前版本: 0.0.8 (2026-01-28 18:00)</span>
    </div>

    <script>
        (function () {
            // Feature detection for compatibility
            var hasMutation = (typeof MutationObserver === 'function');
            var hasPerformance = (window.performance && typeof performance.getEntriesByType === 'function');

            var progressFill = document.getElementById('progressFill');
            var progressText = document.getElementById('progressText');
            var progressPercent = document.getElementById('progressPercent');

            // If neither MutationObserver nor Performance API available, fall back to simple spinner
            if (!hasMutation && !hasPerformance) {
                try {
                    var wrap = document.querySelector('.progress-wrap');
                    var list = document.querySelector('.file-list');
                    if (wrap) wrap.style.display = 'none';
                    if (list) list.style.display = 'none';
                } catch (e) { }
                return;
            }

            var isAppScript = function (src) {
                if (!src) return false;
                try {
                    // match common Nuxt/app bundle identifiers or a /nuxt/ path
                    return /(?:_nuxt|_app|app\.|client|server|\/nuxt\/)/i.test(src) || (/\.(js|mjs)(\?|$)/i.test(src) && /_nuxt|_app|app/i.test(src));
                } catch (e) { return false; }
            };

            var tracked = new Map(); // src -> {state: 'loading'|'loaded'|'error', el}

            function addScript(src, el) {
                if (!src || tracked.has(src)) return;
                tracked.set(src, { state: 'loading', el: el });
                if (el && el.addEventListener) {
                    el.addEventListener('load', function () { markLoaded(src); });
                    el.addEventListener('error', function () { markError(src); });
                }
            }

            function markLoaded(src) {
                var t = tracked.get(src);
                if (!t) return;
                t.state = 'loaded';
                updateProgress();
            }

            function markError(src) {
                var t = tracked.get(src);
                if (!t) return;
                t.state = 'error';
                updateProgress();
            }

            // Per-file rendering removed — we only show aggregated progress

            function updateProgress() {
                try {
                    var values = Array.from(tracked.values());
                    var total = values.length || 0;
                    var loaded = values.filter(function (v) { return v.state === 'loaded'; }).length;
                    var errored = values.filter(function (v) { return v.state === 'error'; }).length;
                    var percent = total ? Math.round((loaded + errored * 0.5) / total * 100) : 0;
                    if (progressFill) progressFill.style.width = percent + '%';
                    if (progressPercent) progressPercent.textContent = percent + '%';
                    if (progressText) progressText.textContent = '已加载 ' + loaded + '/' + total;
                    if (total > 0 && loaded + errored === total) {
                        setTimeout(function () {
                            try {
                                var w = document.querySelector('.progress-wrap');
                                if (w) w.style.display = 'none';
                                var l = document.querySelector('.file-list');
                                if (l) l.style.display = 'none';
                            } catch (e) { }
                        }, 600);
                    }
                } catch (e) { }
            }

            // If MutationObserver available, observe dynamically added scripts
            var mo = null;
            if (hasMutation) {
                try {
                    mo = new MutationObserver(function (muts) {
                        for (var i = 0; i < muts.length; i++) {
                            var m = muts[i];
                            for (var j = 0; j < m.addedNodes.length; j++) {
                                var n = m.addedNodes[j];
                                if (n && n.tagName === 'SCRIPT' && n.src) {
                                    var src = n.src;
                                    if (isAppScript(src)) addScript(src, n);
                                }
                            }
                        }
                    });
                    mo.observe(document.documentElement || document, { childList: true, subtree: true });
                } catch (e) { mo = null; }
            }

            // Initial scan: existing script tags (always safe)
            try {
                var scripts = Array.prototype.slice.call(document.scripts || []);
                for (var si = 0; si < scripts.length; si++) {
                    var s = scripts[si];
                    if (s && s.src && isAppScript(s.src)) {
                        addScript(s.src, s);
                        if (hasPerformance) {
                            try {
                                var perfList = performance.getEntriesByType('resource') || [];
                                for (var pi = 0; pi < perfList.length; pi++) {
                                    var e = perfList[pi];
                                    if (e && e.name === s.src && e.duration > 0) {
                                        markLoaded(s.src);
                                        break;
                                    }
                                }
                            } catch (e) { }
                        }
                    }
                }
            } catch (e) { }

            // If Performance API available, scan periodically for resource entries
            var scanCount = 0;
            var perfInterval = null;
            if (hasPerformance) {
                try {
                    perfInterval = setInterval(function () {
                        try {
                            var resources = performance.getEntriesByType('resource') || [];
                            for (var ri = 0; ri < resources.length; ri++) {
                                var r = resources[ri];
                                if (!r || !r.name) continue;
                                if (isAppScript(r.name) && !tracked.has(r.name)) {
                                    addScript(r.name, null);
                                    if (r.transferSize > 0 || (r.responseEnd && r.responseEnd > 0)) {
                                        markLoaded(r.name);
                                    }
                                }
                            }
                        } catch (e) { }
                        scanCount++;
                        if (scanCount > 30 && perfInterval) {
                            clearInterval(perfInterval);
                            perfInterval = null;
                        }
                    }, 250);
                } catch (e) { }
            }

            // Final safety timeout
            setTimeout(function () {
                try { updateProgress(); } catch (e) { }
                try { if (mo) mo.disconnect(); } catch (e) { }
                try { if (perfInterval) clearInterval(perfInterval); } catch (e) { }
            }, 12000);
        })();
    </script>

</body>

</html>
